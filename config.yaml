location: "Bologna"
refresh_seconds: 900   # full page reload (fresh data) at most this often; between reloads the typing cycle replays in place
home_md_path: "./home.md"

# boot banner: neofetch + btop-style gauges at the start of each cycle
system:
  enabled: true
  disk_path: "/"
  hold_seconds: 5      # pause after the system block before the news starts typing

news_feeds:
  - url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    label: "BBC"
  - url: "https://hnrss.org/frontpage"
    label: "HN"
news_max_items: 5

# "telefoto": the first BBC headline image as braille art, arriving one row at a time
news_image:
  enabled: true
  cols: 60
  rows: 18
  line_ms: 120     # delay between image rows

stocks:
  - symbol: "ASML"
    label: "ASML"
  - symbol: "NVDA"
    label: "NVIDIA"
  - symbol: "MU"
    label: "MICRON"
  - symbol: "RPI.L"
    label: "RASPBERRY PI"
  - symbol: "STMPA.PA"
    label: "STM"

# serial/telex-style character-by-character typing reveal
typing:
  cps: 65            # characters per second printed
  jitter: 0.7        # 0 = steady metronome, 1 = ragged per-character timing
  lf_pause_ms: 150   # extra pause (ms) when the print head starts a new line

# CRT softness: a gentle blur over the rendered content (replaces the old scanlines)
# NOTE: costly on old iPads (A5 / iOS 9) — every typed character repaints the blurred layer
crt:
  enabled: false
  blur_px: 0.3    # 0 = sharp; ~0.6–1.0 = soft phosphor look

# end-of-cycle "video memory corruption" glitch
glitch:
  idle_seconds: 10      # pause at the bottom (read time) before the glitch fires
  duration_seconds: 5   # how long the glitch runs before the page reloads
  churn_ms: 300         # interval between cell mutations (lower = busier flicker)
  blank_ratio: 0.5      # fraction of cells left empty (black) so the field isn't solid

# night-time quiet hours: dashboard activity stops, phosphor-decay screensaver runs
quiet_hours:
  enabled: true
  start: "22:30"        # when the screensaver switches on: hour (22) or "HH:MM" — quote it, YAML reads 22:30 as a number
  end: 6                # when it switches back to the dashboard (wraps past midnight)

# "phosphor decay" screensaver: random glyphs fade brightest→darkest through the amber palette
screensaver:
  count: 40             # number of glyphs glowing on screen at once
  fade_min_seconds: 6   # fading-time range: each glyph picks a random total fade in [min, max]
  fade_max_seconds: 16
  randomness: 0.5       # 0 = even colour steps, 1 = ragged per-step timing (baseline + random)
